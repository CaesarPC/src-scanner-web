<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRC 靶场练习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
.wrap{max-width:800px;margin:0 auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar h1{font-size:22px;color:#fff;margin:0}
.topbar a{color:#888;font-size:13px;text-decoration:none}
button{padding:12px 24px;background:#4f8cff;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
button:hover{background:#3a7aef}
.btn-gray{background:#333}
.site-header{background:#1a1d27;border-radius:10px;padding:16px;margin-bottom:16px;border-left:4px solid #4f8cff}
.site-header h3{color:#fff;font-size:16px;margin-bottom:4px}
.site-header .host{font-family:monospace;color:#4f8cff;font-size:14px;margin:8px 0}
.inputRow{display:flex;gap:10px;margin:16px 0}
.inputRow input{flex:1;padding:12px;border:1px solid #333;border-radius:8px;background:#0f1117;color:#fff;font-size:14px}
.card{background:#1a1d27;border-radius:10px;padding:16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.card input[type=checkbox]{width:20px;height:20px;accent-color:#4f8cff}
.card .url{font-family:monospace;font-size:13px;word-break:break-all;flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.grid .card{margin:0}
.vuln-tag{font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.tag-high{background:#ff4757;color:#fff}
.tag-med{background:#ffa502;color:#000}
.tag-low{background:#2ed573;color:#000}
.tag-safe{background:#333;color:#888}
.result-box{background:#1a1d27;border-radius:10px;padding:16px;margin-bottom:8px}
.correct{border-left:4px solid #2ed573}
.wrong{border-left:4px solid #ff4757}
.missed{border-left:4px solid #ffa502}
.score{font-size:28px;font-weight:bold;text-align:center;margin:20px 0}
.score.good{color:#2ed573}
.score.ok{color:#ffa502}
.score.bad{color:#ff4757}
.explain{font-size:12px;color:#888;margin-top:6px;line-height:1.6}
.explain b{color:#ccc}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-left:8px}
.b-right{background:#2ed573;color:#000}
.b-wrong{background:#ff4757;color:#fff}
.b-miss{background:#ffa502;color:#000}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
<h1>SRC 靶场练习</h1>
<a href="https://caesarpc.github.io/caesarbase/main.html">← 返回CaesarBase</a>
</div>
<p style="color:#888;font-size:13px;margin-bottom:16px">每个目标网站随机生成若干页面，勾选你认为有漏洞的，提交后看答案和原理。</p>

<div id="quizArea"></div>

<div style="text-align:center;margin:20px 0">
<button onclick="submitAnswers()" id="btnSubmit">提交答案</button>
<button onclick="newRound()" class="btn-gray" id="btnNext" style="display:none">下一轮</button>
</div>

<div id="resultArea"></div>
</div>

<script>
var VULNS=[
{url:"/.env",sev:"high",desc:"环境变量文件泄露，包含数据库密码、API密钥",why:"开发者配置失误，.env文件不应被Web服务器直接访问"},
{url:"/.git/config",sev:"high",desc:"Git仓库配置泄露，可拉取整个源码",why:"项目目录没删.git文件夹就部署了"},
{url:"/.git/HEAD",sev:"high",desc:"Git仓库存在，泄露版本信息",why:"同上，.git目录暴露在Web根目录"},
{url:"/backup.sql",sev:"high",desc:"数据库备份文件，含全部用户数据",why:"运维习惯把备份文件放在Web目录里"},
{url:"/www.zip",sev:"high",desc:"整站源码打包泄露",why:"打包后忘了删，直接暴露在服务器上"},
{url:"/phpinfo.php",sev:"med",desc:"PHP配置信息泄露，含服务器路径、模块版本",why:"测试完忘了删phpinfo.php"},
{url:"/admin",sev:"med",desc:"后台管理入口可直接访问",why:"后台没有IP白名单或VPN限制"},
{url:"/actuator/env",sev:"high",desc:"Spring Boot环境变量，含密钥和数据库配置",why:"Spring Boot Actuator未配置访问控制"},
{url:"/actuator/heapdump",sev:"high",desc:"堆转储文件，可从内存提取密码",why:"Actuator端点未保护"},
{url:"/swagger-ui.html",sev:"med",desc:"API文档暴露，可看到所有接口参数",why:"Swagger没加认证"},
{url:"/graphql",sev:"med",desc:"GraphQL端点开放内省查询",why:"生产环境没关内省"},
{url:"/nacos",sev:"high",desc:"Nacos配置中心未授权访问",why:"默认密码或无认证"},
{url:"/druid/index.html",sev:"high",desc:"Druid监控面板未授权",why:"没配访问控制"},
{url:"/.DS_Store",sev:"low",desc:"macOS目录文件泄露，可枚举文件名",why:"macOS自动生成，部署时没删"},
{url:"/server-status",sev:"low",desc:"Apache状态页，泄露服务器信息",why:"Apache默认配置开了mod_status"},
{url:"/config.php.bak",sev:"high",desc:"配置文件备份，可能含数据库密码",why:"编辑器或备份留下的.bak文件"},
{url:"/wp-config.php~",sev:"high",desc:"WordPress配置文件临时备份",why:"vim等编辑器留下的~文件"},
{url:"/debug.log",sev:"med",desc:"调试日志，可能含敏感信息",why:"调试模式开着没关"},
{url:"/.htpasswd",sev:"med",desc:"密码哈希文件泄露",why:"权限配置错误"},
{url:"/console",sev:"med",desc:"调试控制台入口",why:"生产环境没关"},
{url:"/robots.txt",sev:"safe",desc:"只是爬虫规则，正常文件",why:"没事，robots.txt本来就是公开的"},
{url:"/favicon.ico",sev:"safe",desc:"网站图标，正常文件",why:"浏览器自动请求的图标"},
{url:"/login",sev:"safe",desc:"登录页面，正常功能",why:"登录页是正常的，不是漏洞"},
{url:"/sitemap.xml",sev:"safe",desc:"站点地图，正常文件",why:"SEO需要的公开文件"},
{url:"/about",sev:"safe",desc:"关于页面，正常内容",why:"普通静态页面"},
{url:"/contact",sev:"safe",desc:"联系页面，正常内容",why:"普通静态页面"},
{url:"/uploads/",sev:"med",desc:"上传目录可列目录",why:"Nginx/Apache没关目录浏览"},
{url:"/vendor/",sev:"med",desc:"依赖库目录暴露",why:"Composer/vendor目录在Web根下"},
{url:"/storage/logs/laravel.log",sev:"med",desc:"Laravel日志泄露",why:"Laravel storage目录权限错误"},
{url:"/.svn/entries",sev:"med",desc:"SVN仓库泄露",why:"SVN目录暴露在Web根"},
{url:"/adminer.php",sev:"med",desc:"数据库管理工具暴露",why:"Adminer没加IP限制"},
{url:"/phpmyadmin",sev:"med",desc:"phpMyAdmin暴露",why:"没改路径也没加认证"},
{url:"/crossdomain.xml",sev:"safe",desc:"Flash跨域策略，低危或正常",why:"这个一般不算漏洞"},
{url:"/README.md",sev:"safe",desc:"项目说明文档，公开也没事",why:"GitHub项目本来就是公开的"},
{url:"/api/v1/health",sev:"safe",desc:"健康检查接口，正常",why:"监控用的，不泄露敏感信息"},
{url:"/.well-known/security.txt",sev:"safe",desc:"安全联系信息，反而说明正规",why:"这是好事，不是漏洞"}
];

var round=0;
var targets=[];
var host='';

function pickRandom(arr,n){
  return arr.slice().sort(function(){return Math.random()-0.5}).slice(0,n);
}

function newRound(){
  round++;
  document.getElementById('resultArea').innerHTML='';
  document.getElementById('btnSubmit').style.display='';
  document.getElementById('btnNext').style.display='none';
  var vulns=pickRandom(VULNS.filter(function(v){return v.sev!=='safe'}),5);
  var safes=pickRandom(VULNS.filter(function(v){return v.sev==='safe'}),3);
  targets=vulns.concat(safes).sort(function(){return Math.random()-0.5});
  host='https://target-'+Math.floor(Math.random()*9999)+'.com';
  var html='<div class="site-header"><h3>🎯 目标网站 #'+round+'</h3><div class="host">'+host+'</div><p style="color:#888;font-size:12px">勾选你认为有安全问题的页面：</p></div>';
  html+='<div class="grid">';
  targets.forEach(function(t,i){
    html+='<div class="card"><input type="checkbox" id="cb'+i+'"><div class="url">'+t.url+'</div></div>';
  });
  html+='</div>';
  document.getElementById('quizArea').innerHTML=html;
}

function submitAnswers(){
  var score=0;
  var total=targets.length;
  var html='<h2 style="color:#4f8cff;margin:20px 0 10px">答案解析</h2>';
  targets.forEach(function(t,i){
    var cb=document.getElementById('cb'+i);
    var checked=cb.checked;
    var isVuln=t.sev!=='safe';
    var right=(checked&&isVuln)||(!checked&&!isVuln);
    if(right)score++;
    var cls=isVuln?(checked?'correct':'missed'):(checked?'wrong':'correct');
    var badge=isVuln?(checked?'<span class="badge b-right">✅ 选对了</span>':'<span class="badge b-miss">⚠️ 漏了</span>'):(checked?'<span class="badge b-wrong">❌ 误报</span>':'<span class="badge b-right">✅ 正确</span>');
    var sevTag=t.sev==='safe'?'<span class="vuln-tag tag-safe">正常</span>':'<span class="vuln-tag tag-'+(t.sev==='high'?'high':t.sev==='med'?'med':'low')+'">'+(t.sev==='high'?'高危':t.sev==='med'?'中危':'低危')+'</span>';
    html+='<div class="result-box '+cls+'"><div style="font-family:monospace;font-size:13px">'+t.url+' '+sevTag+badge+'</div>';
    html+='<div class="explain"><b>'+t.desc+'</b><br>原理：'+t.why+'</div></div>';
  });
  var pct=Math.round(score/total*100);
  var scoreCls=pct>=80?'good':pct>=50?'ok':'bad';
  var msg=pct>=80?'厉害！可以去实战了':pct>=50?'还不错，多练几轮':'继续练，别急';
  html='<div class="score '+scoreCls+'">'+score+'/'+total+' ('+pct+'%)</div><p style="text-align:center;color:#888;margin-bottom:16px">'+msg+'</p>'+html;
  document.getElementById('resultArea').innerHTML=html;
  document.getElementById('btnSubmit').style.display='none';
  document.getElementById('btnNext').style.display='';
}

newRound();
</script>
</body>
</html>
