*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f1117;color:#e0e0e0}
.page{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.page.show{display:flex}
.box{background:#1a1d27;padding:30px;border-radius:12px;width:100%;max-width:420px}
h1{font-size:20px;margin-bottom:20px;text-align:center;color:#fff}
p{font-size:13px;line-height:1.7;color:#999;margin-bottom:12px}
input{width:100%;padding:12px;border:1px solid #333;border-radius:8px;background:#0f1117;color:#fff;font-size:16px;margin-bottom:16px}
button{padding:12px 20px;background:#4f8cff;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap}
button:hover{background:#3a7aef}
button:disabled{background:#555;cursor:not-allowed}
.btnFull{width:100%;margin-bottom:10px}
.btnGray{background:#333}
.err{color:#ff6b6b;text-align:center;margin-top:12px;font-size:14px}
.disc{background:#11141a;padding:12px;border-radius:8px;font-size:11px;color:#666;line-height:1.7;margin-top:16px;text-align:left}
.disc b{color:#999}
#scanPage{display:none;min-height:100vh;padding:20px;align-items:flex-start;justify-content:center}
#scanPage.show{display:flex}
.wrap{max-width:900px;width:100%}
.topBar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topBar h1{margin:0;font-size:22px;color:#fff}
.inputRow{display:flex;gap:10px;margin-bottom:12px}
.inputRow input{flex:1;margin-bottom:0}
.scanBtns{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.scanBtns button{font-size:13px;padding:10px 16px}
.layerTag{font-size:12px;font-weight:bold;margin:16px 0 8px;padding:4px 10px;border-radius:4px;display:inline-block}
.l1{background:#1a3a2a;color:#2ed573}
.l2{background:#3a2a1a;color:#ffa502}
.l3{background:#3a1a1a;color:#ff4757}
.progressBar{height:4px;background:#222;border-radius:2px;margin-bottom:8px;overflow:hidden}
.progressFill{height:100%;background:#4f8cff;width:0%;transition:width .3s}
.progressText{font-size:11px;color:#444;margin-bottom:16px;word-break:break-all;min-height:16px}
.result{background:#1a1d27;border-radius:8px;margin-bottom:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.result.high{border-left:4px solid #ff4757}
.result.medium{border-left:4px solid #ffa502}
.result.low{border-left:4px solid #2ed573}
.result.info{border-left:4px solid #5352ed;opacity:.7}
.path{font-family:monospace;font-size:13px;word-break:break-all}
.badge{font-size:11px;padding:2px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
.b-high{background:#ff4757;color:#fff}
.b-medium{background:#ffa502;color:#000}
.b-low{background:#2ed573;color:#000}
.b-info{background:#5352ed;color:#fff}
.meta{font-size:11px;color:#666;margin-top:3px}
.count{font-size:13px;color:#888;margin-bottom:10px}
a{color:#4f8cff;text-decoration:none;white-space:nowrap;font-size:13px}

// ===== 深层：高危/关键目标，实际问题检测 =====
var L3=[
{path:"/.git/config",severity:"high",note:"Git仓库配置泄露，可拉取源码"},

var findings={1:[],2:[],3:[]};

async function checkPath(url){
  for(var i=0;i<PROXIES.length;i++){
    try{
      var c=new AbortController();var t=setTimeout(function(){c.abort()},6000);
      var r=await fetch(PROXIES[i]+encodeURIComponent(url),{signal:c.signal,redirect:'follow'});
      clearTimeout(t);
      return {status:r.status,headers:r.headers,text:await r.text().catch(function(){return ''})};
    }catch(e){}
  }
  return null;
}

function similarity(a,b){
  if(!a||!b)return 0;
  a=a.slice(0,500);b=b.slice(0,500);
  if(a===b)return 1;
  var s={};for(var i=0;i<a.length;i++)s[a[i]]=1;
  var c=0;for(var j=0;j<b.length;j++)if(s[b[j]])c++;
  return c/Math.max(a.length,b.length);
}

async function runLayer(num){
  var target=document.getElementById('target').value.trim();
  if(!target){alert('请输入网址');return}
  if(target.indexOf('http')!==0){alert('请带http://');return}
  var base=target.replace(/\/$/,"");
  document.getElementById('btnAll').disabled=true;
  findings[num]=[];
  var homeText='';
  var homeRes=await checkPath(base+'/');
  if(homeRes)homeText=homeRes.text||'';

  if(num<=2){
    var paths=num===1?L1:L2;
    var total=paths.length;
    var BATCH=50;
    for(var i=0;i<total;i+=BATCH){
      var batch=paths.slice(i,i+BATCH);
      document.getElementById('progress').textContent=(num===1?'浅层':'中层')+'扫描中... ('+Math.min(i+BATCH,total)+'/'+total+')';
      var results=await Promise.all(batch.map(async function(p){
        var res=await checkPath(base+p);
        if(!res||res.status!==200)return null;
        var body=res.text||'';
        var isSensitive=/\.(sql|zip|tar\.gz|rar|7z|key|pem|env|DS_Store|bak|swp|log)$/.test(p)||p.indexOf('.git/')>=0||p.indexOf('.env')>=0;
        if(/robots\.txt|favicon\.ico|sitemap\.xml|crossdomain/.test(p))return null;
        if(!isSensitive&&homeText&&body&&similarity(homeText,body)>0.85)return null;
        if(body.length<20)return null;
        if(/404 not found|page not found|页面不存在|找不到/i.test(body.slice(0,1000)))return null;
        if(/codetabs|corsproxy|502 bad gateway|503/i.test(body.slice(0,500)))return null;
        var sev='low';
        if(isSensitive)sev='high';
        else if(/admin|phpmyadmin|swagger|actuator|nacos|druid|jenkins|graphql|console|manager|adminer|tomcat|weblogic/i.test(p))sev='medium';
        return {path:p,url:base+p,status:res.status,severity:sev};
      }));
      results.filter(Boolean).forEach(function(r){findings[num].push(r)});
      document.getElementById('bar').style.width=(Math.min(i+BATCH,total)/total*100)+'%';
      renderLayers();
    }
  } else {
    // 深层：检查高危路径
    var total3=L3.length;
    for(var k=0;k<total3;k++){
      var item=L3[k];
      document.getElementById('progress').textContent='深层检测: '+item.path+' ('+(k+1)+'/'+total3+')';
      var res=await checkPath(base+item.path);
      if(res&&res.status===200){
        var body=res.text||'';
        if(body.length<20)continue;
        if(homeText&&body&&similarity(homeText,body)>0.85)continue;
        findings[3].push({path:item.path,url:base+item.path,status:res.status,severity:item.severity,note:item.note});
        renderLayers();
      }
      document.getElementById('bar').style.width=((k+1)/total3*100)+'%';
    }
  }
  document.getElementById('progress').textContent=(num===1?'浅层':num===2?'中层':'深层')+'扫描完成';
  document.getElementById('btnAll').disabled=false;
  renderLayers();
}

async function runAll(){await runLayer(1);await runLayer(2);await runLayer(3)}

function renderLayers(){
  var label={high:'高危',medium:'中危',low:'低危',info:'信息'};
  var order={high:0,medium:1,low:2,info:3};
  var names={1:'浅层扫描',2:'中层扫描',3:'深层扫描'};
  var tags={1:'l1',2:'l2',3:'l3'};
  var html='';
  for(var l=1;l<=3;l++){
    if(findings[l].length===0)continue;
    var sorted=findings[l].slice().sort(function(a,b){return(order[a.severity]||9)-(order[b.severity]||9)});
    html+='<div class="layerTag '+tags[l]+'">'+names[l]+' · '+sorted.length+' 项</div>';
    for(var i=0;i<sorted.length;i++){
      var r=sorted[i];
      html+='<div class="result '+r.severity+'"><div><div class="path">'+r.path+'<span class="badge b-'+r.severity+'">'+(label[r.severity]||'')+'</span></div><div class="meta">'+r.status+(r.note?' · '+r.note:'')+'</div></div><a href="'+r.url+'" target="_blank">打开</a></div>';
    }
  }
  if(!html)html='<div style="color:#555;padding:20px;text-align:center">等待扫描...</div>';
  document.getElementById('layerResults').innerHTML=html;
}
</script>
