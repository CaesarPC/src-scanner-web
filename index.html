<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRC Scanner</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#0f1117; color:#e0e0e0; min-height:100vh; }
.page { display:none; }
.page.active { display:block; }

/* 登录页 */
#loginPage { min-height:100vh; display:flex; align-items:center; justify-content:center; }
.box { background:#1a1d27; padding:40px; border-radius:12px; width:90%; max-width:360px; }
h1 { font-size:20px; margin-bottom:24px; text-align:center; color:#fff; }
input { width:100%; padding:12px; margin-bottom:16px; border:1px solid #333; border-radius:8px; background:#0f1117; color:#fff; font-size:16px; }
button { padding:12px 24px; background:#4f8cff; color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; }
button:hover { background:#3a7aef; }
button:disabled { background:#555; cursor:not-allowed; }
.btn-full { width:100%; }
.err { color:#ff6b6b; text-align:center; margin-top:12px; font-size:14px; }

/* 主页面 */
.container { max-width:900px; margin:0 auto; padding:20px; }
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.top-bar h1 { margin:0; text-align:left; font-size:22px; }
.input-row { display:flex; gap:10px; margin-bottom:20px; }
input[type=text] { flex:1; padding:12px; border:1px solid #333; border-radius:8px; background:#1a1d27; color:#fff; font-size:15px; }
.status { margin-bottom:16px; font-size:14px; color:#888; }
.result { background:#1a1d27; border-radius:8px; margin-bottom:8px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.result.high { border-left:4px solid #ff4757; }
.result.medium { border-left:4px solid #ffa502; }
.result.low { border-left:4px solid #2ed573; }
.result.info { border-left:4px solid #5352ed; opacity:0.7; }
.path { font-family:monospace; font-size:14px; word-break:break-all; }
.badge { font-size:12px; padding:2px 8px; border-radius:4px; margin-left:8px; white-space:nowrap; }
.b-high { background:#ff4757; color:#fff; }
.b-medium { background:#ffa502; color:#000; }
.b-low { background:#2ed573; color:#000; }
.b-info { background:#5352ed; color:#fff; }
.meta { font-size:12px; color:#888; margin-top:4px; }
.count { font-size:14px; color:#888; margin-bottom:12px; }
a { color:#4f8cff; text-decoration:none; white-space:nowrap; }
a:hover { text-decoration:underline; }
.logout { font-size:13px; color:#888; background:none; border:1px solid #444; padding:6px 12px; }
</style>
</head>
<body>

<!-- 登录页 -->
<div class="page active" id="loginPage">
  <div class="box">
    <h1>SRC Scanner</h1>
    <input type="password" id="pwd" placeholder="输入密码" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-full" onclick="login()">进 入</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- 主页面 -->
<div class="page" id="mainPage">
  <div class="container">
    <div class="top-bar">
      <h1>SRC 自动扫描</h1>
      <button class="logout" onclick="logout()">退出</button>
    </div>
    <div class="input-row">
      <input type="text" id="target" placeholder="输入目标网址，如 https://example.com">
      <button onclick="scan()" id="btn">开始扫描</button>
    </div>
    <div class="status" id="status"></div>
    <div class="count" id="count"></div>
    <div id="results"></div>
  </div>
</div>

<script>
const API = "https://src-scanner.cr-tools.workers.dev";
let savedPwd = localStorage.getItem('src_pwd') || '';

// 已登录直接进主页
if (savedPwd) { showMain(); }

async function login() {
  const pwd = document.getElementById('pwd').value;
  try {
    const r = await fetch(API + '/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password: pwd})
    });
    const d = await r.json();
    if (d.ok) {
      savedPwd = pwd;
      localStorage.setItem('src_pwd', pwd);
      showMain();
    } else {
      document.getElementById('err').textContent = d.error || '错误';
    }
  } catch(e) {
    document.getElementById('err').textContent = '连接失败: ' + e.message;
  }
}

function logout() {
  savedPwd = '';
  localStorage.removeItem('src_pwd');
  document.getElementById('loginPage').classList.add('active');
  document.getElementById('mainPage').classList.remove('active');
}

function showMain() {
  document.getElementById('loginPage').classList.remove('active');
  document.getElementById('mainPage').classList.add('active');
}

async function scan() {
  const target = document.getElementById('target').value.trim();
  if (!target) { alert('请输入网址'); return; }
  if (!target.startsWith('http')) { alert('请带 http:// 或 https://'); return; }
  document.getElementById('btn').disabled = true;
  document.getElementById('status').textContent = '扫描中... 请稍等';
  document.getElementById('results').innerHTML = '';
  document.getElementById('count').textContent = '';
  try {
    const r = await fetch(API + '/api/scan', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-Auth-Password': savedPwd},
      body: JSON.stringify({target})
    });
    const d = await r.json();
    if (d.error) { alert(d.error); return; }
    renderResults(d);
  } catch(e) {
    alert('请求失败: ' + e.message);
  }
  document.getElementById('btn').disabled = false;
  document.getElementById('status').textContent = '扫描完成';
}

function renderResults(data) {
  document.getElementById('count').textContent = '发现 ' + data.length + ' 个非404结果';
  if (data.length === 0) {
    document.getElementById('results').innerHTML = '<div style="color:#666;padding:20px;">没有发现非404路径</div>';
    return;
  }
  const label = {high:'高危', medium:'中危', low:'低危', info:'需认证'};
  document.getElementById('results').innerHTML = data.map(r =>
    '<div class="result ' + r.severity + '">' +
      '<div>' +
        '<div class="path">' + r.path + '<span class="badge b-' + r.severity + '">' + (label[r.severity]||'') + '</span></div>' +
        '<div class="meta">HTTP ' + r.status + ' · ' + r.contentLen + ' bytes · ' + (r.contentType||'').split(';')[0] + '</div>' +
      '</div>' +
      '<a href="' + r.url + '" target="_blank">打开</a>' +
    '</div>'
  ).join('');
}
</script>
</body>
</html>
